name: Build, test & lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          # sdkmanager is not on PATH by default on GitHub runners; look for it
          # under the standard cmdline-tools locations instead.
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="${ANDROID_HOME}/cmdline-tools/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::warning::sdkmanager not found at $SDKMANAGER; assuming the required SDK components are already installed under $ANDROID_HOME"
            exit 0
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests, lint and debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
